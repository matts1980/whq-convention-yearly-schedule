<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHQ Broadcasting – US Convention Yearly Schedule</title>
<style>
:root {
  --navy: #1a2744;
  --navy-mid: #243360;
  --blue: #2d5be3;
  --blue-light: #4a7af5;
  --gold: #c8a84b;
  --gold-light: #e0c170;
  --cream: #f7f5f0;
  --white: #ffffff;
  --gray-soft: #e8e6e0;
  --gray-mid: #9a98a0;
  --text-dark: #1a1a2e;
  --text-mid: #3d3b50;

  --c-helpdesk:   #4a7af5;
  --c-closeout:   #e07070;
  --c-planning:   #7e9e5f;
  --c-maintenance:#b07bd4;
  --c-orders:     #e09040;
  --c-design:     #2d5be3;
  --c-training:   #40b0c8;
  --c-upload:     #6080d4;
  --c-budget:     #c8a84b;
  --c-events:     #2f9e8f;
  --c-sitetraining: #c85a8f;
  --c-kickoff:    #4a6fa5;
  --c-zonecloseout: #a55a3c;
  --c-designreview: #5a7d9e;
  --c-coordination: #b5852a;
  --c-newsites:   #3c7a6a;

  /* Group / assignment colors (used for Gantt bars) */
  --g-avcontacts:   #2d8c6f;
  --g-avdc:         #3a4a7a;
  --g-avdesign:     #c8762d;
  --g-avreviewer:   #7e9e5f;
  --g-avdoversight: #5db8e8;
  --g-efs:          #8a5a2b;
  --g-office:       #8a6cae;
  --g-tms:          #d4607a;
  --g-usrct:        #3a4a7a;
  --g-helpdesk:     #e08a30;
  --g-support:      #b07bd4;
  --g-trainers:     #1aa39a;
  --g-documentation: #6b7280;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--cream); color: var(--text-dark); }

/* ── Header ── */
header {
  background: var(--navy);
  color: var(--white);
  padding: 24px 40px 0;
  border-bottom: 3px solid var(--gold);
}
header .eyebrow { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-light); margin-bottom: 6px; }
header h1 { font-size: 22px; font-weight: 700; }
header p { font-size: 12px; color: #a8b4cc; margin-top: 4px; margin-bottom: 16px; }

/* ── Tab bar ── */
.tabs { display: flex; gap: 4px; margin-top: 12px; }
.tab-btn {
  padding: 10px 22px;
  font-size: 13px;
  font-weight: 600;
  color: #a8b4cc;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  letter-spacing: 0.2px;
  transition: all 0.15s;
}
.tab-btn:hover { color: var(--white); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* Progress Filter toggle */
.progress-toggle {
  margin-left: auto;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 600;
  color: #c0cce8;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
}
.progress-toggle:hover { background: rgba(255,255,255,0.14); color: var(--white); }
.progress-toggle .pt-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gray-mid);
  border: 2px solid rgba(255,255,255,0.3);
  transition: all 0.15s;
}
.progress-toggle.on {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--navy);
}
.progress-toggle.on .pt-dot { background: #1f7a3d; border-color: var(--navy); }

/* ── Views ── */
.view { display: none; padding: 28px 32px 60px; }
.view.active { display: block; }

/* ══════════════════════════════════════
   VIEW 1 — GANTT
══════════════════════════════════════ */
.gantt-wrap { overflow-x: auto; }
.gantt-table { border-collapse: collapse; min-width: 1100px; width: 100%; }
.gantt-table th {
  background: var(--navy);
  color: var(--gold);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  padding: 8px 4px;
  border: 1px solid var(--navy-mid);
  white-space: nowrap;
}
.gantt-table th.label-col { text-align: left; padding-left: 10px; width: 240px; min-width: 240px; }
.gantt-month { width: calc((100% - 240px) / 12); }

.gantt-group td {
  background: var(--navy-mid);
  color: var(--gold-light);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 6px 10px;
  border: 1px solid #1a2744;
}
.gantt-row td {
  border: 1px solid var(--gray-soft);
  padding: 0;
  height: 38px;
  vertical-align: middle;
  background: var(--white);
}
.gantt-row td.row-label {
  padding: 6px 10px;
  font-size: 11.5px;
  color: var(--text-dark);
  white-space: normal;
  line-height: 1.3;
  background: #f9f8f5;
  border-right: 2px solid var(--gray-soft);
}
.gantt-row:hover td { background: #f0f4ff; }
.gantt-row:hover td.row-label { background: #e8eeff; }
.gantt-cell { position: relative; }

/* Current-month column highlight */
.gantt-table th.current-month { background: var(--gold); color: var(--navy); }
.gantt-cell.current-month { background: rgba(200,168,75,0.10); }
.gantt-row:hover td.current-month { background: rgba(200,168,75,0.18); }

/* Past task dimming — only active when Progress Filter is ON */
body.progress-on .is-past { opacity: 0.4; }
body.progress-on .gantt-row.is-past td.row-label { font-style: italic; color: var(--gray-mid); }

/* Calendar current-month highlight */
.cal-month.current-month { box-shadow: 0 0 0 2px var(--gold); }
.cal-month.current-month .cal-month-header { background: var(--gold); color: var(--navy); }
/* Timeline current-month highlight */
.tl-month-band.current-month .tl-month-name { color: var(--gold); }
.tl-month-band.current-month .tl-month-dot { background: var(--gold); border-color: var(--navy); }
.tl-month-band.current-month .tl-month-name::after { content: ' • TODAY'; font-size: 10px; color: var(--navy); background: var(--gold); padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
.gantt-bar {
  position: absolute;
  top: 6px; bottom: 6px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  padding: 0 5px;
  font-size: 9.5px;
  font-weight: 600;
  color: var(--white);
  overflow: hidden;
  white-space: nowrap;
  cursor: default;
  transition: opacity 0.15s;
  text-shadow: 0 1px 2px rgba(0,0,0,0.55);
}
.gantt-bar:hover { opacity: 0.85; }
.gantt-owner-tag {
  display: inline-block;
  background: rgba(0,0,0,0.2);
  border-radius: 2px;
  padding: 1px 4px;
  font-size: 8.5px;
  margin-left: 4px;
}
.task-num-g {
  display: inline-block;
  background: rgba(0,0,0,0.25);
  border-radius: 2px;
  padding: 1px 4px;
  font-size: 9px;
  margin-right: 4px;
}

/* ══════════════════════════════════════
   VIEW 2 — MONTHLY CALENDAR GRID
══════════════════════════════════════ */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.cal-month {
  background: var(--white);
  border: 1px solid var(--gray-soft);
  border-radius: 8px;
  overflow: hidden;
}
.cal-month-header {
  background: var(--navy);
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 14px;
}
.cal-tasks { padding: 10px; display: flex; flex-direction: column; gap: 5px; min-height: 60px; }
.cal-task {
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 11px;
  color: var(--white);
  line-height: 1.35;
}
.cal-task .ct-num { font-weight: 700; opacity: 0.85; margin-right: 3px; }
.cal-task .ct-owner { display: block; font-size: 9.5px; opacity: 0.8; margin-top: 2px; }
.cal-task .ct-dates { display: block; font-size: 9.5px; opacity: 0.9; margin-top: 2px; font-weight: 600; }
.cal-empty { color: var(--gray-mid); font-size: 11px; font-style: italic; padding: 10px; }

/* ══════════════════════════════════════
   VIEW 3 — PHASE TIMELINE
══════════════════════════════════════ */
.timeline-wrap { position: relative; padding-left: 40px; }
.timeline-spine {
  position: absolute;
  left: 16px; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--navy), var(--blue-light));
  border-radius: 2px;
}
.tl-month-band { margin-bottom: 0; }
.tl-month-label {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  margin-top: 24px;
}
.tl-month-dot {
  position: absolute;
  left: -32px;
  width: 18px; height: 18px;
  background: var(--navy);
  border: 3px solid var(--gold);
  border-radius: 50%;
}
.tl-month-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.tl-month-line {
  flex: 1;
  height: 1px;
  background: var(--gray-soft);
}
.tl-tasks { display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; }
.tl-task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--white);
  border: 1px solid var(--gray-soft);
  border-radius: 6px;
  padding: 9px 12px;
  border-left: 4px solid var(--blue-light);
}
.tl-task-num {
  font-size: 10px; font-weight: 700;
  color: var(--white);
  background: var(--navy);
  border-radius: 3px;
  padding: 2px 6px;
  white-space: nowrap;
  margin-top: 1px;
  flex-shrink: 0;
}
.tl-task-body { flex: 1; }
.tl-task-desc { font-size: 12.5px; font-weight: 600; color: var(--text-dark); line-height: 1.35; }
.tl-task-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tl-tag {
  font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 500;
}
.tl-tag.owner { background: #eef2ff; color: var(--blue); border: 1px solid #c8d4f8; }
.tl-tag.cat { background: #fdf6e8; color: #8a6010; border: 1px solid #e8d8a0; }
.tl-tag.dates { background: #f0f8f0; color: #3a6a3a; border: 1px solid #b0d8b0; }
.tl-tag.dur { background: #eef0f5; color: var(--navy); border: 1px solid #c4cbdc; font-weight: 700; }
.tl-tag.owner-group {
  color: #fff;
  border: none;
  font-weight: 600;
  text-shadow: 0 1px 2px rgba(0,0,0,0.45);
}

/* Timeline duration bar (mini 12-month track) */
.tl-dur-track {
  position: relative;
  height: 8px;
  background: #ececec;
  border-radius: 4px;
  margin-top: 8px;
  overflow: hidden;
}
.tl-dur-fill {
  position: absolute;
  top: 0; bottom: 0;
  border-radius: 4px;
}
.tl-dur-scale {
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  color: var(--gray-mid);
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* ── Shared legend ── */
.legend-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--white);
  border: 1px solid var(--gray-soft);
  border-radius: 6px;
  align-items: center;
}
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-mid); }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* Clickable group filter chips */
.leg.clickable {
  cursor: pointer;
  padding: 3px 9px 3px 7px;
  border-radius: 20px;
  border: 1px solid var(--gray-soft);
  user-select: none;
  transition: all 0.12s;
}
.leg.clickable:hover { border-color: var(--gray-mid); background: #f4f3ef; }
.leg.clickable.active {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--white);
  font-weight: 600;
}
.leg.clickable.dimmed { opacity: 0.4; }
.leg-note { width:100%; font-weight:700; color:var(--navy); margin-top:4px; font-size:11px; display:flex; align-items:center; gap:10px; }
.leg-clear {
  cursor: pointer;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--blue);
  background: #eef2ff;
  border: 1px solid #c8d4f8;
  border-radius: 20px;
  padding: 2px 10px;
  display: none;
}
.leg-clear.show { display: inline-block; }
.leg-clear:hover { background: #dde6ff; }

@media (max-width: 800px) {
  .cal-grid { grid-template-columns: repeat(2,1fr); }
  header { padding: 16px 16px 0; }
  .view { padding: 16px 12px 40px; }
  .tab-btn { padding: 8px 12px; font-size: 11px; }
}
</style>
</head>

<!-- ══════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════ -->
<div class="view active" id="view-gantt">

  </div>
</div>

<!-- ══════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════ -->
<div class="view" id="view-calendar">
  <div class="legend-bar" id="legend-calendar" data-note="Card color = assigned group (split cards = shared between groups). Click a group to filter."></div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- ══════════════════════════════════════════════════════════
     VIEW 3 — PHASE TIMELINE
══════════════════════════════════════════════════════════ -->
<div class="view" id="view-timeline">

  <div class="timeline-wrap">
    <div class="timeline-spine"></div>
    <div id="tlContent"></div>
  </div>
</div>

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── Dynamic "current month first" ordering ──
const NOW = new Date();
const CUR_MONTH = NOW.getMonth() + 1; // 1-12
const CUR_DAY = NOW.getDate();
// Month order starting at the current month, rolling forward 12 months
const SY_MONTHS = Array.from({length: 12}, (_, i) => ((CUR_MONTH - 1 + i) % 12) + 1);

// ── Group / assignment color mapping (for Gantt bars) ──
const GROUP_COLORS = {
  'Zone Contacts & Assistants':            'var(--g-avcontacts)',
  'AV Reviewer':                 'var(--g-avreviewer)',
  'AVD Oversight':               'var(--g-avdoversight)',
  'EFS':                         'var(--g-efs)',
  'Office':                      'var(--g-office)',
  'TMS':                         'var(--g-tms)',
  'US Regional Convention Team': 'var(--g-usrct)',
  'Helpdesk Team':              'var(--g-helpdesk)',
  'Support':                    'var(--g-support)',
  'Convention Trainers':        'var(--g-trainers)',
  'Documentation Team':         'var(--g-documentation)',
};

// Parse an owner string like "US Regional Convention Team · Zone Contacts & Assistants" into an array of groups
function parseGroups(owner) {
  return owner.split('·').map(s => s.trim());
}
// Build a CSS background: solid for 1 group, hard-edged gradient split for 2+
function groupBackground(owner) {
  const groups = parseGroups(owner);
  const colors = groups.map(g => GROUP_COLORS[g] || 'var(--gray-mid)');
  if (colors.length === 1) return colors[0];
  const n = colors.length;
  const stops = colors.map((c, i) => {
    const from = (i / n * 100).toFixed(2);
    const to = ((i + 1) / n * 100).toFixed(2);
    return `${c} ${from}%, ${c} ${to}%`;
  });
  return `linear-gradient(90deg, ${stops.join(', ')})`;
}


// ── helper: day of year (1-365)
function doy(month, day) { 
  const days=[0,31,59,90,120,151,181,212,243,273,304,334];
  return days[month-1]+day;
}
const YEAR_DAYS = 365;

// Order tasks relative to the CURRENT month: current month = 0, rolling forward.
function serviceYearKey(month, day) {
  const offset = (month - CUR_MONTH + 12) % 12; // current month=0 ... 11
  return offset * 31 + day;
}
function sortByServiceYearStart(a, b) {
  return serviceYearKey(a.startMonth, a.startDay) - serviceYearKey(b.startMonth, b.startDay);
}

// Position of a date on the duration-bar track that STARTS Sept 1 (Sept 1 = 0,
// ramping to ~371 the following Aug 31). Used for the timeline duration bars.
function serviceYearTrackPos(month, day) {
  const dayOfYear = (month - 1) * 31 + day;
  const boundary  = (9 - 1) * 31 + 1; // Sept 1
  let pos = dayOfYear - boundary;
  if (pos < 0) pos += 12 * 31; // dates before Sept 1 wrap to the end of the track
  return pos;
}

// Service year resets Aug 15 and runs to the following Aug 14. We order every
// task's END date on the service-year timeline (seasonStart = most recent Aug 15),
// then a task is "past" only if its end falls between seasonStart and today.
const SY_BOUNDARY_MONTH = 8;   // August
const SY_BOUNDARY_DAY = 15;    // 15th

function isPastTask(t) {
  const yr = NOW.getFullYear();
  const today = new Date(yr, CUR_MONTH - 1, CUR_DAY, 0, 0, 0);

  // Most recent reset (Aug 15) on/before today:
  let resetYear = yr;
  const thisYearReset = new Date(yr, SY_BOUNDARY_MONTH - 1, SY_BOUNDARY_DAY, 0, 0, 0);
  if (today < thisYearReset) resetYear = yr - 1;
  const seasonStart = new Date(resetYear, SY_BOUNDARY_MONTH - 1, SY_BOUNDARY_DAY, 0, 0, 0);
  const seasonEnd   = new Date(resetYear + 1, SY_BOUNDARY_MONTH - 1, SY_BOUNDARY_DAY, 0, 0, 0); // next Aug 15

  // Place the task's END date on the timeline so it lands within [seasonStart, seasonEnd).
  // Special case: end dates in the Aug 15–31 window are END-of-season tasks (they run
  // right up to the next reset), so pin them to the upcoming August, not season start.
  let endYearForTask = resetYear;
  const endsInResetWindow = (t.endMonth === SY_BOUNDARY_MONTH && t.endDay >= SY_BOUNDARY_DAY);
  if (endsInResetWindow) endYearForTask = resetYear + 1;

  let endDate = new Date(endYearForTask, t.endMonth - 1, t.endDay, 23, 59, 59);
  if (endDate < seasonStart) {
    endDate = new Date(endYearForTask + 1, t.endMonth - 1, t.endDay, 23, 59, 59);
  }
  // A task is past only if its placed end date is before today (and within this season).
  return endDate >= seasonStart && endDate < today;
}

// ═══════════════════════════════════
// BUILD GANTT
// ═══════════════════════════════════
function buildGantt() {
  const body = document.getElementById('ganttBody');
  const headRow = document.getElementById('ganttHeadRow');

  // Build dynamic month header in current-month-first order
  SY_MONTHS.forEach((m, idx) => {
    const th = document.createElement('th');
    th.className = 'gantt-month';
    if (m === CUR_MONTH) th.classList.add('current-month');
    th.textContent = MONTHS[m-1].slice(0,3).toUpperCase();
    headRow.appendChild(th);
  });

  // Group by category
  const groups = {};
  TASKS.forEach(t => {
    if (!groups[t.cat]) groups[t.cat] = [];
    groups[t.cat].push(t);
  });
  // Sort each section's tasks by start date relative to current month
  Object.keys(groups).forEach(cat => groups[cat].sort(sortByServiceYearStart));

  const catOrder = CAT_ORDER;
  catOrder.forEach(cat => {
    if (!groups[cat]) return;
    // Group header row
    const gr = document.createElement('tr');
    gr.className = 'gantt-group';
    gr.dataset.section = cat;
    const gTd = document.createElement('td');
    gTd.colSpan = 13;
    gTd.textContent = CAT_LABELS[cat].toUpperCase();
    gr.appendChild(gTd);
    body.appendChild(gr);

    groups[cat].forEach(task => {
      const tr = document.createElement('tr');
      tr.className = 'gantt-row';
      tr.dataset.section = cat;
      tr.dataset.groups = parseGroups(task.owner).join('|');
      if (isPastTask(task)) tr.classList.add('is-past');

      // Label cell — sequential top-to-bottom number (stable across all tabs)
      const labelTd = document.createElement('td');
      labelTd.className = 'row-label';
      labelTd.innerHTML = `<strong>${task.seq}.</strong> ${task.desc}<br><small style="color:var(--gray-mid)">${task.owner}</small>`;
      tr.appendChild(labelTd);

      // 12 month cells in current-month-first order
      SY_MONTHS.forEach((m, colIdx) => {
        const td = document.createElement('td');
        td.className = 'gantt-cell';
        if (m === CUR_MONTH) td.classList.add('current-month');
        td.style.position = 'relative';

        // Task start/end in doy, handle wrap
        let tStart = doy(task.startMonth, task.startDay);
        let tEnd   = doy(task.endMonth,   task.endDay);
        if (tEnd < tStart) tEnd += YEAR_DAYS;

        const cStart = doy(m, 1);
        const cEnd   = doy(m, 28);
        const overlap = tStart <= cEnd && tEnd >= cStart;

        if (overlap) {
          const bar = document.createElement('div');
          bar.className = 'gantt-bar';
          bar.style.background = groupBackground(task.owner);

          const cellDays = 30;
          const barStartInCell = Math.max(0, tStart - cStart);
          const barEndInCell   = Math.min(cellDays, tEnd - cStart);
          const leftPct  = (barStartInCell / cellDays) * 100;
          const rightPct = ((cellDays - barEndInCell) / cellDays) * 100;
          bar.style.left  = leftPct + '%';
          bar.style.right = rightPct + '%';
          bar.title = `${task.seq}. ${task.desc} · ${task.owner}`;

          // Show label text only in the first visible column of the bar
          if (m === task.startMonth) {
            bar.innerHTML = `<span class="task-num-g">${task.seq}</span><span style="overflow:hidden;text-overflow:ellipsis">${task.desc}</span>`;
          }
          td.appendChild(bar);
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  });
}

// ═══════════════════════════════════
// BUILD CALENDAR GRID
// ═══════════════════════════════════
function buildCalendar() {
  const grid = document.getElementById('calGrid');
  SY_MONTHS.forEach(m => {
    const col = document.createElement('div');
    col.className = 'cal-month';
    if (m === CUR_MONTH) col.classList.add('current-month');

    const hdr = document.createElement('div');
    hdr.className = 'cal-month-header';
    hdr.textContent = MONTHS[m-1].toUpperCase();
    col.appendChild(hdr);

    const tasksDiv = document.createElement('div');
    tasksDiv.className = 'cal-tasks';

    const monthTasks = TASKS.filter(t => {
      let tStart = doy(t.startMonth, t.startDay);
      let tEnd   = doy(t.endMonth,   t.endDay);
      if (tEnd < tStart) tEnd += YEAR_DAYS;
      const cStart = doy(m, 1);
      const cEnd   = doy(m, 28);
      return tStart <= cEnd && tEnd >= cStart;
    }).sort(sortByServiceYearStart);

    if (monthTasks.length === 0) {
      tasksDiv.innerHTML = '<div class="cal-empty">No tasks this month</div>';
    } else {
      monthTasks.forEach(t => {
        const el = document.createElement('div');
        el.className = 'cal-task';
        if (isPastTask(t)) el.classList.add('is-past');
        el.dataset.groups = parseGroups(t.owner).join('|');
        el.style.background = groupBackground(t.owner);
        el.style.textShadow = '0 1px 2px rgba(0,0,0,0.55)';
        const dateStr = t.startMonth === t.endMonth
          ? `${MONTHS[t.startMonth-1].slice(0,3)} ${t.startDay} – ${t.endDay}`
          : `${MONTHS[t.startMonth-1].slice(0,3)} ${t.startDay} – ${MONTHS[t.endMonth-1].slice(0,3)} ${t.endDay}`;
        el.innerHTML = `<span class="ct-num">${t.seq}.</span>${t.desc}<span class="ct-dates">📅 ${dateStr}</span><span class="ct-owner">${t.owner}</span>`;
        tasksDiv.appendChild(el);
      });
    }

    col.appendChild(tasksDiv);
    grid.appendChild(col);
  });
}

// ═══════════════════════════════════
// BUILD TIMELINE
// ═══════════════════════════════════
function buildTimeline() {
  const content = document.getElementById('tlContent');

  SY_MONTHS.forEach(m => {
    const monthTasks = TASKS.filter(t => {
      // Show task in the month it STARTS (primary placement)
      return t.startMonth === m;
    }).sort(sortByServiceYearStart);

    const band = document.createElement('div');
    band.className = 'tl-month-band';
    if (m === CUR_MONTH) band.classList.add('current-month');

    const labelRow = document.createElement('div');
    labelRow.className = 'tl-month-label';
    labelRow.innerHTML = `
      <div class="tl-month-dot"></div>
      <div class="tl-month-name">${MONTHS[m-1]}</div>
      <div class="tl-month-line"></div>
    `;
    band.appendChild(labelRow);

    if (monthTasks.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--gray-mid);font-size:11px;font-style:italic;padding:4px 0 8px;';
      empty.textContent = 'No new tasks start this month';
      band.appendChild(empty);
    } else {
      const taskWrap = document.createElement('div');
      taskWrap.className = 'tl-tasks';
      monthTasks.forEach(t => {
        const dateStr = t.startMonth === t.endMonth
          ? `${MONTHS[t.startMonth-1].slice(0,3)} ${t.startDay} – ${t.endDay}`
          : `${MONTHS[t.startMonth-1].slice(0,3)} ${t.startDay} – ${MONTHS[t.endMonth-1].slice(0,3)} ${t.endDay}`;

        // Duration in days (handle wrap), then human label
        let tStart = doy(t.startMonth, t.startDay);
        let tEnd   = doy(t.endMonth, t.endDay);
        if (tEnd < tStart) tEnd += YEAR_DAYS;
        const durDays = tEnd - tStart + 1;
        let durLabel;
        if (durDays <= 10)      durLabel = `${durDays} days`;
        else if (durDays < 45)  durLabel = `${Math.round(durDays/7)} wks`;
        else                    durLabel = `${(durDays/30.4).toFixed(1)} mo`;

        // Position the fill on a service-year track that starts Aug 15
        const trackStart = serviceYearTrackPos(t.startMonth, t.startDay);
        let leftPct = (trackStart / (12*31)) * 100;
        let widthPct = ((durDays) / (12*31)) * 100;
        if (leftPct + widthPct > 100) widthPct = 100 - leftPct; // clamp at track end

        const el = document.createElement('div');
        el.className = 'tl-task';
        if (isPastTask(t)) el.classList.add('is-past');
        el.dataset.groups = parseGroups(t.owner).join('|');
        const bg = groupBackground(t.owner);
        if (bg.startsWith('linear-gradient')) {
          el.style.borderLeftColor = 'transparent';
          el.style.borderImage = bg.replace('90deg', 'to bottom') + ' 1';
          el.style.borderImageSlice = '1';
        } else {
          el.style.borderLeftColor = bg;
        }
        const fillBg = bg.startsWith('linear-gradient') ? bg : bg;
        // One colored bubble per assigned group, matching the legend colors
        const ownerBubbles = parseGroups(t.owner).map(g => {
          const c = GROUP_COLORS[g] || 'var(--gray-mid)';
          return `<span class="tl-tag owner-group" style="background:${c};">${g}</span>`;
        }).join('');
        el.innerHTML = `
          <span class="tl-task-num">${t.seq}</span>
          <div class="tl-task-body">
            <div class="tl-task-desc">${t.desc}</div>
            <div class="tl-task-meta">
              ${ownerBubbles}
              <span class="tl-tag cat">${CAT_LABELS[t.cat]}</span>
              <span class="tl-tag dates">${dateStr}</span>
              <span class="tl-tag dur">⏱ ${durLabel}</span>
            </div>
            <div class="tl-dur-track">
              <div class="tl-dur-fill" style="left:${leftPct}%;width:${widthPct}%;background:${fillBg};"></div>
            </div>
            <div class="tl-dur-scale">
              <span>Sep</span>
              <span>Dec</span>
              <span>Mar</span>
              <span>Jun</span>
              <span>Aug</span>
            </div>
          </div>
        `;
        taskWrap.appendChild(el);
      });
      band.appendChild(taskWrap);
    }

    band.dataset.hasTasks = monthTasks.length > 0 ? '1' : '0';
    content.appendChild(band);
  });
}

// ═══════════════════════════════════
// GROUP FILTERING ENGINE
// ═══════════════════════════════════
// Active filter is a Set of selected group names (empty = show all)
const activeFilter = new Set();

function buildLegends() {
  const groupNames = Object.keys(GROUP_COLORS);
  ['gantt','calendar','timeline'].forEach(view => {
    const bar = document.getElementById('legend-' + view);
    if (!bar) return;
    bar.innerHTML = '';
    groupNames.forEach(name => {
      const chip = document.createElement('div');
      chip.className = 'leg clickable';
      chip.dataset.group = name;
      chip.innerHTML = `<div class="leg-dot" style="background:${GROUP_COLORS[name]}"></div>${name}`;
      chip.addEventListener('click', () => toggleGroup(name));
      bar.appendChild(chip);
    });
    // Note + clear-all row
    const note = document.createElement('div');
    note.className = 'leg-note';
    note.innerHTML = `<span>${bar.dataset.note || ''}</span><span class="leg-clear" data-view="${view}">Clear filter ✕</span>`;
    bar.appendChild(note);
    note.querySelector('.leg-clear').addEventListener('click', clearFilter);
  });
  refreshChips();
}

function toggleGroup(name) {
  if (activeFilter.has(name)) activeFilter.delete(name);
  else activeFilter.add(name);
  applyFilter();
  refreshChips();
}

function clearFilter() {
  activeFilter.clear();
  applyFilter();
  refreshChips();
}

// Update chip visuals + clear buttons across all legends
function refreshChips() {
  const any = activeFilter.size > 0;
  document.querySelectorAll('.leg.clickable').forEach(chip => {
    const g = chip.dataset.group;
    chip.classList.toggle('active', activeFilter.has(g));
    chip.classList.toggle('dimmed', any && !activeFilter.has(g));
  });
  document.querySelectorAll('.leg-clear').forEach(btn => btn.classList.toggle('show', any));
}

// A task's groups string (pipe-separated) matches if ANY of its groups is selected
function rowMatches(groupsAttr) {
  if (activeFilter.size === 0) return true;
  const groups = (groupsAttr || '').split('|');
  return groups.some(g => activeFilter.has(g));
}

function applyFilter() {
  // ── Gantt: rows + hide section headers with no visible rows ──
  const ganttBody = document.getElementById('ganttBody');
  if (ganttBody) {
    // First pass: show/hide task rows, tally per section
    const sectionHasVisible = {};
    ganttBody.querySelectorAll('tr.gantt-row').forEach(tr => {
      const show = rowMatches(tr.dataset.groups);
      tr.style.display = show ? '' : 'none';
      if (show) sectionHasVisible[tr.dataset.section] = true;
    });
    // Second pass: hide empty section headers
    ganttBody.querySelectorAll('tr.gantt-group').forEach(gr => {
      gr.style.display = sectionHasVisible[gr.dataset.section] ? '' : 'none';
    });
  }

  // ── Calendar: cards + "no tasks" placeholder per month ──
  document.querySelectorAll('#calGrid .cal-month').forEach(col => {
    const tasksDiv = col.querySelector('.cal-tasks');
    const cards = tasksDiv.querySelectorAll('.cal-task');
    let visible = 0;
    cards.forEach(c => {
      const show = rowMatches(c.dataset.groups);
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    // Manage placeholder
    let placeholder = tasksDiv.querySelector('.cal-empty');
    if (cards.length > 0) {
      if (visible === 0) {
        if (!placeholder) {
          placeholder = document.createElement('div');
          placeholder.className = 'cal-empty';
          tasksDiv.appendChild(placeholder);
        }
        placeholder.textContent = 'No matching tasks';
        placeholder.style.display = '';
      } else if (placeholder) {
        placeholder.style.display = 'none';
      }
    }
  });

  // ── Timeline: tasks + hide month bands with no visible tasks ──
  document.querySelectorAll('#tlContent .tl-month-band').forEach(band => {
    const tasks = band.querySelectorAll('.tl-task');
    let visible = 0;
    tasks.forEach(t => {
      const show = rowMatches(t.dataset.groups);
      t.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    // Hide the whole band (month) if it had tasks but none match
    if (band.dataset.hasTasks === '1') {
      band.style.display = visible === 0 ? 'none' : '';
    }
  });
}

// ═══════════════════════════════════
// Tab switching (resets filter)
// ═══════════════════════════════════
function switchTab(view, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  btn.classList.add('active');
  // Reset filter when switching tabs
  activeFilter.clear();
  applyFilter();
  refreshChips();
}

// ═══════════════════════════════════
// PROGRESS FILTER TOGGLE (off by default)
// ═══════════════════════════════════
let progressOn = false;
function toggleProgress() {
  progressOn = !progressOn;
  document.body.classList.toggle('progress-on', progressOn);
  const btn = document.getElementById('progressToggle');
  btn.classList.toggle('on', progressOn);
  btn.querySelector('.pt-label').textContent = 'Service Year Progress Filter: ' + (progressOn ? 'On' : 'Off');
}

// ── Assign a stable sequential number (matching Gantt top-to-bottom order) to every task ──
const CAT_ORDER = ['planning','kickoff','maintenance','orders','newsites','design','designreview','helpdesk','zonecloseout','closeout','coordination','training','sitetraining','upload','budget','events'];
function assignSeq() {
  const groups = {};
  TASKS.forEach(t => { (groups[t.cat] = groups[t.cat] || []).push(t); });
  Object.keys(groups).forEach(cat => groups[cat].sort(sortByServiceYearStart));
  let n = 0;
  CAT_ORDER.forEach(cat => {
    if (!groups[cat]) return;
    groups[cat].forEach(t => { t.seq = ++n; });
  });
}

// Init all 3
assignSeq();
buildGantt();
buildCalendar();
buildTimeline();
buildLegends();

// Auto-scroll the active view to the current month on load.
// Gantt: scroll the horizontal wrapper so the current-month column is in view.
// Calendar/Timeline: current month is already first in order, so they start at top.
window.addEventListener('load', () => {
  // The current month is always the FIRST column/box/band now, so views start aligned.
  // For the Gantt, ensure the wrapper is scrolled fully left (current month leads).
  const gw = document.querySelector('.gantt-wrap');
  if (gw) gw.scrollLeft = 0;
});
</script>
